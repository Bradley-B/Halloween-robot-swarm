<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halloween Robot Swarm</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #17131d;
        color: #f5f0e9;
      }
      * { box-sizing: border-box; }
      main { padding: 2rem; width: min(100%, 42rem); }
      h1 { color: #ff9f43; }
      form { display: grid; gap: 0.75rem; margin-top: 2rem; }
      label { font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #655a70;
        border-radius: 0.4rem;
        font: inherit;
      }
      input, select, textarea { background: #251f2e; color: #f5f0e9; }
      input[type="color"] { height: 3.5rem; padding: 0.3rem; cursor: pointer; }
      textarea { font-family: monospace; resize: vertical; }
      button { background: #ff9f43; color: #17131d; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: wait; }
      :focus-visible { outline: 2px solid #ff9f43; outline-offset: 3px; }
      .hint { color: #c2b8cb; font-size: 0.9rem; }
      [role="status"] { min-height: 1.5em; }
      [role="status"][data-state="error"] { color: #ffaaaa; }
      [role="status"][data-state="success"] { color: #a4e5b4; }
      details { margin-top: 2rem; }
      summary { cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Halloween Robot Swarm</h1>
      <p>Control the LED strips on all connected robots.</p>
      <form id="strip-form">
        <label for="strip-mode">LED strip mode</label>
        <select id="strip-mode" name="mode" aria-describedby="mode-hint">
          <option value="rainbow">Rainbow</option>
          <option value="pulse_sine">Pulse sine wave</option>
          <option value="pulse_square">Pulse square wave</option>
          <option value="solid">Solid</option>
          <option value="off">Off</option>
        </select>
        <span id="mode-hint" class="hint"></span>
        <label for="strip-color">LED strip color <output id="color-value" for="strip-color">#ff9f43</output></label>
        <input type="color" id="strip-color" name="color" value="#ff9f43"
               aria-describedby="color-hint">
        <span id="color-hint" class="hint">Color applies to solid and pulse modes.</span>
        <button type="submit">Apply to all robots</button>
      </form>
      <p id="strip-status" role="status" aria-live="polite"></p>
      <p class="hint">Settings are sent when you click Apply. They reset to rainbow when a robot restarts.</p>
      <details>
        <summary>Custom command</summary>
        <form id="command-form">
          <label for="subject">NATS subject</label>
          <input id="subject" name="subject" value="robots.commands" required
                 autocomplete="off" spellcheck="false" aria-describedby="subject-hint">
          <span id="subject-hint" class="hint">Use the subject your robots listen to.</span>
          <label for="message">Command (JSON)</label>
          <textarea id="message" name="message" rows="9" required spellcheck="false">{
  "target": "all",
  "command": "strip.set",
  "params": {
    "mode": "solid",
    "color": "#ff9f43"
  }
}</textarea>
          <button type="submit">Send command</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </details>
    </main>
    <script>
      const form = document.querySelector('#command-form');
      const status = document.querySelector('#status');
      const stripForm = document.querySelector('#strip-form');
      const stripStatus = document.querySelector('#strip-status');
      const modeHint = document.querySelector('#mode-hint');
      const modeHints = {
        rainbow: 'A moving rainbow across the strip. The selected color is unused.',
        pulse_sine: 'The selected color smoothly fades down and back up every two seconds.',
        pulse_square: 'The selected color switches on for one second, then off for one second.',
        solid: 'The whole strip stays lit in the selected color.',
        off: 'All strip LEDs are off.'
      };
      function updateModeHint() {
        modeHint.textContent = modeHints[stripForm.elements.mode.value];
      }
      stripForm.elements.mode.addEventListener('change', updateModeHint);
      updateModeHint();
      stripForm.elements.color.addEventListener('input', () => {
        document.querySelector('#color-value').value = stripForm.elements.color.value;
      });

      async function publishCommand(subject, message, button, status, successMessage) {
        button.disabled = true;
        status.dataset.state = '';
        status.textContent = 'Sending…';
        try {
          const response = await fetch('/api/commands', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, message })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Could not publish the command.');
          status.dataset.state = 'success';
          status.textContent = successMessage || `Published to ${result.subject}.`;
        } catch (error) {
          status.dataset.state = 'error';
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      }

      stripForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        await publishCommand('robots.commands', {
          target: 'all',
          command: 'strip.set',
          params: {
            mode: stripForm.elements.mode.value,
            color: stripForm.elements.color.value
          }
        }, stripForm.querySelector('button'), stripStatus, 'LED strip settings sent to all robots.');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        let message;
        try {
          message = JSON.parse(form.elements.message.value);
          if (message === null) throw new Error('null message');
        } catch {
          status.dataset.state = 'error';
          status.textContent = 'Enter a valid, non-null JSON command.';
          return;
        }
        await publishCommand(form.elements.subject.value.trim(), message, form.querySelector('button'), status);
      });
    </script>
  </body>
</html>
